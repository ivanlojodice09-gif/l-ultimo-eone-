<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAST EON</title>
    <style>
      :root {
        --bg: #05070d;
        --bg-2: #0d1420;
        --panel: rgba(17, 25, 36, 0.9);
        --line: rgba(255,255,255,0.12);
        --text: #edf3ff;
        --muted: #a8b7d1;
        --gold: #d9b76d;
        --blue: #76a9ff;
        --cyan: #7fe7dc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #0a1425 0%, var(--bg) 42%, #020509 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }

      .hero {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(12,18,26,0.9), rgba(8,11,17,0.95));
        border-radius: 18px;
        padding: 28px 28px 20px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 5vw, 5rem);
        line-height: 0.96;
      }

      .subtitle {
        margin-top: 18px;
        font-size: 1.05rem;
        color: var(--muted);
        line-height: 1.7;
        max-width: 760px;
      }

      .meta {
        margin-top: 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .chip {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        padding: 8px 12px;
        border-radius: 999px;
        color: var(--text);
        font-size: 0.82rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 28px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
        margin-bottom: 12px;
      }

      .panel p, .panel li {
        color: var(--muted);
        line-height: 1.8;
      }

      .panel ul {
        margin: 0;
        padding-left: 18px;
      }

      canvas {
        width: 100%;
        height: 320px;
        display: block;
        border-radius: 16px;
        margin-top: 20px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(10,18,28,0.95), rgba(7,9,15,0.98));
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .control {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }

      .control label {
        display: block;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 8px;
      }

      .control input[type="range"] {
        width: 100%;
      }

      .control output {
        display: inline-block;
        margin-top: 8px;
        font-size: 0.86rem;
        color: var(--text);
      }

      .footer {
        margin-top: 40px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <div class="eyebrow" id="heroEyebrow">LAST EON</div>
        <h1 id="siteTitle">Wildland Revolution</h1>
        <div class="subtitle" id="heroDescription">
          Caricamento dati...
        </div>
        <div class="meta" id="metaChips"></div>
      </header>

      <section class="grid" id="featureGrid"></section>

      <section class="panel" style="margin-top: 28px;">
        <h2 id="storyTitle">Visualizzazione generativa</h2>
        <p id="storyText" style="color: var(--muted); line-height: 1.8;"></p>

        <canvas id="signalCanvas" width="1100" height="320"></canvas>

        <div class="controls">
          <div class="control">
            <label for="intensity">Intensità</label>
            <input id="intensity" type="range" min="0.1" max="1.0" step="0.01" value="0.62" />
            <output id="intensityValue">0.62</output>
          </div>

            <div class="control">
            <label for="frequency">Frequenza</label>
            <input id="frequency" type="range" min="0.5" max="6" step="0.1" value="2.4" />
            <output id="frequencyValue">2.4</output>
          </div>

          <div class="control">
            <label for="constance">Costanza</label>
            <input id="constance" type="range" min="0" max="1" step="0.01" value="0.72" />
            <output id="constanceValue">0.72</output>
          </div>
        </div>
      </section>

      <div class="footer" id="footerText">
        LAST EON · Open Source Immersive Digital Experience
      </div>
    </div>

    <script>
      const canvas = document.getElementById('signalCanvas');
      const ctx = canvas.getContext('2d');

      const intensityInput = document.getElementById('intensity');
      const frequencyInput = document.getElementById('frequency');
      const constanceInput = document.getElementById('constance');

      const intensityValue = document.getElementById('intensityValue');
      const frequencyValue = document.getElementById('frequencyValue');
      const constanceValue = document.getElementById('constanceValue');

      const heroEyebrow = document.getElementById('heroEyebrow');
      const siteTitle = document.getElementById('siteTitle');
      const heroDescription = document.getElementById('heroDescription');
      const metaChips = document.getElementById('metaChips');
      const featureGrid = document.getElementById('featureGrid');
      const storyTitle = document.getElementById('storyTitle');
      const storyText = document.getElementById('storyText');
      const footerText = document.getElementById('footerText');

      function updateLabels() {
        intensityValue.textContent = Number(intensityInput.value).toFixed(2);
        frequencyValue.textContent = Number(frequencyInput.value).toFixed(1);
        constanceValue.textContent = Number(constanceInput.value).toFixed(2);
      }

      function drawCurve() {
        const w = canvas.width;
        const h = canvas.height;
        const intensity = Number(intensityInput.value);
        const frequency = Number(frequencyInput.value);
        const constance = Number(constanceInput.value);

        ctx.clearRect(0, 0, w, h);

        const grad = ctx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, '#76a9ff');
        grad.addColorStop(0.5, '#7fe7dc');
        grad.addColorStop(1, '#d9b76d');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5;
        ctx.beginPath();

        for (let x = 0; x <= w; x += 4) {
          const nx = x / w;
          const yBase = h / 2;
          const wave = Math.sin((nx * Math.PI * 2 * frequency) + performance.now() * 0.0013) * (20 + (1 - constance) * 70);
          const envelope = Math.sin(nx * Math.PI) * intensity * 120;
          const y = yBase + wave + envelope * (0.5 + constance);

          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, h * 0.7);

        for (let x = 0; x <= w; x += 5) {
          const nx = x / w;
          const drift = Math.sin((nx * 12 + performance.now() * 0.0016) * (1 + constance)) * 30;
          const y = h * 0.7 + drift;
          ctx.lineTo(x, y);
        }

        ctx.lineWidth = 1.1;
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.stroke();
      }

      function animate() {
        updateLabels();
        drawCurve();
        requestAnimationFrame(animate);
      }

      [intensityInput, frequencyInput, constanceInput].forEach(input => input.addEventListener('input', updateLabels));

      async function loadProject() {
        try {
          const response = await fetch('./project.json');
          if (!response.ok) throw new Error('project.json non trovato');

          const data = await response.json();

          heroEyebrow.textContent = data.hero.eyebrow || 'LAST EON';
          siteTitle.textContent = data.site?.title || 'Wildland Revolution';
          heroDescription.textContent = data.hero?.description || 'LAST EON';

          metaChips.innerHTML = '';
          (data.stats || []).forEach(item => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = `${item.label}: ${item.value}`;
            metaChips.appendChild(chip);
          });

          featureGrid.innerHTML = '';
          (data.applications || []).forEach(item => {
            const panel = document.createElement('article');
            panel.className = 'panel';

            const h = document.createElement('h2');
            h.textContent = item.title;

            const p = document.createElement('p');
            p.textContent = item.text;

            panel.appendChild(h);
            panel.appendChild(p);
            featureGrid.appendChild(panel);
          });

          storyTitle.textContent = data.story?.title || 'Tra dato, ambiente e percezione';
          storyText.textContent = data.story?.text || 'LAST EON esplora la relazione tra segnali, memoria e forma.';

          footerText.textContent = data.footer || 'LAST EON · Open Source Immersive Digital Experience';
        } catch (error) {
          console.error(error);
          heroEyebrow.textContent = 'LAST EON';
          siteTitle.textContent = 'Wildland Revolution';
          heroDescription.textContent = 'LAST EON è un progetto generativo e immersivo in evoluzione.';
          footerText.textContent = 'LAST EON · Open Source Immersive Digital Experience';
        }
      }

      loadProject();
      animate();
    </script>
  </body>
</html>
